services:
  # Master server on port 50051
  master_server_01:
    container_name: master_server_01
    build:
      context: .
      dockerfile: Dockerfile
    image: gfs-image
    # Run the binary built into the image; no rebuild at container startup
    command: bazel-bin/src/server/master_server/run_master_server_main
      --config_path=data/config.yml
      --use_docker_dns_server
      --master_name=master_server_01
    working_dir: /app
    ports:
      - 50051:50051
    volumes:
      # Persist the master's metadata store (and share the config); the
      # volume is initialized from the image contents on first use
      - gfs_data:/app/data
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/50051"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # Chunk server #1 on port 50052
  chunk_server_01:
    container_name: chunk_server_01
    image: gfs-image
    command: bazel-bin/src/server/chunk_server/run_chunk_server_main
      --config_path=data/config.yml
      --use_docker_dns_server
      --chunk_server_name=chunk_server_01
    ports:
      - 50052:50052
    depends_on:
      master_server_01:
        condition: service_healthy
    working_dir: /app
    volumes:
      - gfs_data:/app/data
    restart: unless-stopped

  # Chunk server #2 on port 50053
  chunk_server_02:
    container_name: chunk_server_02
    image: gfs-image
    command: bazel-bin/src/server/chunk_server/run_chunk_server_main
      --config_path=data/config.yml
      --use_docker_dns_server
      --chunk_server_name=chunk_server_02
    ports:
      - 50053:50053
    depends_on:
      master_server_01:
        condition: service_healthy
    working_dir: /app
    volumes:
      - gfs_data:/app/data
    restart: unless-stopped

  # Chunk server #3 on port 50054
  chunk_server_03:
    container_name: chunk_server_03
    image: gfs-image
    command: bazel-bin/src/server/chunk_server/run_chunk_server_main
      --config_path=data/config.yml
      --use_docker_dns_server
      --chunk_server_name=chunk_server_03
    ports:
      - 50054:50054
    depends_on:
      master_server_01:
        condition: service_healthy
    working_dir: /app
    volumes:
      - gfs_data:/app/data
    restart: unless-stopped

volumes:
  gfs_data:
