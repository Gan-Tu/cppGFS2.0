# Cluster configuration used by the GFS Playground web app (webapp/server.py).
# Identical to data/config.yml except for a faster heartbeat, so failure
# detection and re-replication are quick enough to watch interactively.
version: 1.0
servers:
  master_servers:
    - master_server_01
  chunk_servers:
    - chunk_server_01
    - chunk_server_02
    - chunk_server_03
network:
  master_server_01:
    hostname: master_server_01
    port: 50051
  chunk_server_01:
    hostname: chunk_server_01
    port: 50052
  chunk_server_02:
    hostname: chunk_server_02
    port: 50053
  chunk_server_03:
    hostname: chunk_server_03
    port: 50054
  dns_lookup_table: # Hostname -> IP address mapping
    # The playground runs every server in one process namespace, so all
    # hostnames resolve to the loopback wildcard
    master_server_01: 0.0.0.0
    chunk_server_01: 0.0.0.0
    chunk_server_02: 0.0.0.0
    chunk_server_03: 0.0.0.0
disk:
  # The block size (MB) for each GFS file chunk
  block_size_mb: 64
  # The minimum disk space (MB) that a chunk server has to maintain
  min_free_disk_space_mb: 100
  # The number of chunk servers each chunk is replicated on
  replication_factor: 3
  # on-disk leveldb databases; kept under data/ so the docker volume
  # persists them across container restarts
  leveldb:
    master_server_01: data/dbs/master_server_01
    chunk_server_01: data/dbs/chunk_server_01
    chunk_server_02: data/dbs/chunk_server_02
    chunk_server_03: data/dbs/chunk_server_03
timeout:
  # The valid suffixes are "ns", "us" "ms", "s", "m", and "h".
  grpc: 10s
  lease: 60s
  # Fast heartbeat: a dead chunk server is detected within seconds, and the
  # re-replication repair scan runs every pass
  heartbeat: 5s
  client_cache: 10m
