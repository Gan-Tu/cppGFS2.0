name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # GitHub-hosted runners ship bazelisk as `bazel`, which respects our
      # .bazelversion pin
      - name: Mount bazel cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/bazel
          key: bazel-${{ runner.os }}-${{ hashFiles('MODULE.bazel', '.bazelversion') }}
          restore-keys: |
            bazel-${{ runner.os }}-

      - name: Build everything
        run: bazel build //...

      - name: Run unit and integration tests
        run: bazel test //tests/common/... //tests/client/... //tests/server/... --test_output=errors
